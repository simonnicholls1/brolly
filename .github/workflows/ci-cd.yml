name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Tests (SQLite + Postgres)
        run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres
      - name: Docker image builds and starts
        run: |
          docker build -t brolly-ci .
          docker run -d --name brolly-ci -p 8000:8000 brolly-ci
          for i in $(seq 1 20); do curl -fsS localhost:8000/healthz && exit 0; sleep 1; done
          docker logs brolly-ci; exit 1

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://needacoat.com
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy to Fly
        run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Smoke test live site
        run: |
          for i in $(seq 1 10); do
            if curl -fsS https://needacoat.com/healthz &&
               curl -fsS "https://needacoat.com/api/verdict?lat=51.5072&lon=-0.1276" | grep -q '"answer"'; then
              echo "live site OK"; exit 0
            fi
            sleep 6
          done
          echo "live site check failed"; exit 1
