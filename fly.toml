# Fly.io config. Votes live in Postgres (Neon) via the DATABASE_URL secret,
# so there is no volume. See the README for deploy steps.
app = "ancient-pine-6068"
primary_region = "lhr"

[build]

[env]
  CANONICAL_HOST = "needacoat.com"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
