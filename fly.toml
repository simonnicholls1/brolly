# Fly.io config. Run `fly launch --copy-config --no-deploy` to claim an app name,
# then follow the steps in the README.
app = "ancient-pine-6068"
primary_region = "lhr"

[build]

[env]
  DATABASE_PATH = "/data/brolly.db"
  CANONICAL_HOST = "needacoat.com"

[mounts]
  source = "brolly_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
